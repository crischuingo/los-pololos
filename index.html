<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los Pololos</title>
<style>
:root{--bg:#17100d;--card:#251a15;--line:#3b2b23;--tx:#fff3e8;--mut:#b99f90;--or:#ff6b2c;--rd:#e8344e;--tq:#1fd1c1;--ye:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 50% -10%,#4a1f14,transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.3rem;margin:8px 0 2px;letter-spacing:-1px;background:linear-gradient(90deg,var(--ye),var(--or),var(--rd));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
input{width:100%;font:inherit;font-size:1.1rem;padding:15px;border-radius:14px;border:2px solid var(--line);background:#120c09;color:var(--tx);margin-bottom:10px;outline:none}
input:focus{border-color:var(--tq)}
#code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:800}
button{width:100%;font:inherit;font-size:1.1rem;font-weight:800;padding:16px;border:0;border-radius:16px;color:#1a0c06;background:linear-gradient(135deg,var(--ye),var(--or));cursor:pointer;margin-bottom:10px}
button:active{transform:scale(.98)}
button.tq{background:var(--tq)}
button.rd{background:linear-gradient(135deg,var(--or),var(--rd));color:#fff}
button.gh{background:transparent;color:var(--mut);border:2px solid var(--line);font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px}.row button{margin-bottom:0}
.or{text-align:center;color:var(--mut);margin:6px 0 12px}
.err{background:#4a1520;border:1px solid var(--rd);color:#ffb3bf;border-radius:12px;padding:12px;margin-bottom:12px}
.warn{background:#3b2f10;border:1px solid var(--ye);color:var(--ye);border-radius:12px;padding:12px;margin-bottom:12px}
.big{font-size:2.6rem;font-weight:900;letter-spacing:8px;text-align:center;color:var(--ye);margin:4px 0 12px}
.lbl{color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:2px;text-align:center}
ul{list-style:none;margin:0;padding:0}
li{padding:11px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
li:last-child{border:0}
.tag{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--tq);color:#06201d}
.tag.h{background:var(--ye);color:#3a2a00}
.res{text-align:center;padding:22px 12px;border:2px solid var(--tq);background:linear-gradient(160deg,#10302d,var(--card))}
.res .n{font-size:2.2rem;font-weight:900;margin:10px 0 16px;word-break:break-word}
.res .n.none{font-size:1.4rem;color:var(--ye)}
.res .n.hid{letter-spacing:6px;color:var(--mut)}
.min{color:var(--ye);text-align:center;margin:0 0 10px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== 1) PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ====== */
const CFG={
  apiKey:"AIzaSyCoE9MuSfWfLRxF9BS_pmbKI-JZUyIsex0",
  authDomain:"los-pololos-fd018.firebaseapp.com",
  databaseURL:"https://los-pololos-fd018-default-rtdb.firebaseio.com",
  projectId:"los-pololos-fd018",
  appId:"1:822825861407:web:f26ee2905308ff00d3702a"
};
/* ======================================================= */

const configured=!CFG.apiKey.startsWith("TU_");
const db=configured?getDatabase(initializeApp(CFG)):null;
const app=document.getElementById("app");
const MIN=6, ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mkCode=()=>Array.from({length:5},()=>ALPHA[Math.random()*ALPHA.length|0]).join("");
const mkId=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const link=c=>location.origin+location.pathname+"?sala="+c;

let S={code:null,id:null,room:null,players:{},pair:null,show:false,err:"",round:0,unsubs:[],prefill:{name:"",code:""}};

/* Etiquetas únicas: dos "Sebastián" -> "Sebastián (1)" y "Sebastián (2)" */
function labels(pl){
  const e=Object.entries(pl).sort((a,b)=>(a[1].t-b[1].t)||a[0].localeCompare(b[0]));
  const tot={},seen={},out={};
  e.forEach(([,p])=>{const k=p.name.toLowerCase();tot[k]=(tot[k]||0)+1});
  e.forEach(([id,p])=>{const k=p.name.toLowerCase();seen[k]=(seen[k]||0)+1;out[id]=tot[k]>1?`${p.name} (${seen[k]})`:p.name});
  return {out,order:e.map(x=>x[0])};
}

function listen(){
  S.unsubs.forEach(f=>f());
  const c=S.code,id=S.id;
  S.unsubs=[
    onValue(ref(db,`rooms/${c}/meta`),s=>{S.room=s.val();if(!S.room&&S.code)return leave();
      if(S.room&&S.room.round!==S.round){S.round=S.room.round;S.show=false}render()}),
    onValue(ref(db,`rooms/${c}/players`),s=>{S.players=s.val()||{};render()}),
    onValue(ref(db,`rooms/${c}/pairs/${id}`),s=>{S.pair=s.val();render()}) // solo TU resultado
  ];
}
function start(code,id,name){
  localStorage.setItem("pololos",JSON.stringify({code,id,name}));
  Object.assign(S,{code,id,room:null,players:{},pair:null,show:false,err:"",round:0});
  history.replaceState(null,"",location.pathname);
  listen();render();
}
function leave(){
  S.unsubs.forEach(f=>f());S.unsubs=[];
  localStorage.removeItem("pololos");
  Object.assign(S,{code:null,id:null,room:null,players:{},pair:null,err:""});
  render();
}

async function create(name){
  let code;
  for(let i=0;i<6;i++){code=mkCode();if(!(await get(ref(db,`rooms/${code}/meta`))).exists())break}
  const id=mkId(),t=Date.now();
  await set(ref(db,`rooms/${code}`),{meta:{host:id,status:"lobby",round:0,t},players:{[id]:{name,t}}});
  start(code,id,name);
}
async function join(code,name){
  const m=(await get(ref(db,`rooms/${code}/meta`))).val();
  if(!m)throw new Error("Esa sala no existe. Revisa el código.");
  if(m.status!=="lobby")throw new Error("Esa sala ya hizo el sorteo. Pide al anfitrión una sala nueva.");
  const id=mkId();
  await set(ref(db,`rooms/${code}/players/${id}`),{name,t:Date.now()});
  start(code,id,name);
}
async function draw(){
  const {out,order}=labels(S.players);
  if(order.length<MIN)return;
  const a=[...order];
  for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}
  const pairs={};
  for(let i=0;i+1<a.length;i+=2){pairs[a[i]]={p:out[a[i+1]]};pairs[a[i+1]]={p:out[a[i]]}}
  if(a.length%2)pairs[a[a.length-1]]={none:true};
  await update(ref(db),{[`rooms/${S.code}/pairs`]:pairs,[`rooms/${S.code}/meta/status`]:"drawn",[`rooms/${S.code}/meta/round`]:(S.room.round||0)+1});
}
async function copy(txt,btn){
  try{await navigator.clipboard.writeText(txt)}catch{prompt("Copia esto:",txt)}
  const o=btn.textContent;btn.textContent="¡Copiado!";setTimeout(()=>btn.textContent=o,1200);
}

function render(){
  if(!configured){app.innerHTML=`<h1>Los Pololos</h1><div class="warn">Falta configurar Firebase. Pega tus datos en la constante <b>CFG</b> dentro de index.html.</div>`;return}
  if(!S.code){
    app.innerHTML=`<h1>Los Pololos 💘</h1><p class="sub">Parejas secretas. Cero spoilers.</p>
    ${S.err?`<div class="err">${esc(S.err)}</div>`:""}
    <div class="card"><input id="name" maxlength="20" placeholder="Tu nombre" value="${esc(S.prefill.name)}">
    <button data-a="create">Crear sala</button>
    <div class="or">— o únete con un código —</div>
    <input id="code" maxlength="5" placeholder="CÓDIGO" value="${esc(S.prefill.code)}">
    <button class="tq" data-a="join">Unirme</button></div>`;
    return;
  }
  if(!S.room){app.innerHTML=`<p class="sub">Conectando…</p>`;return}
  const {out,order}=labels(S.players);
  const host=S.room.host===S.id, n=order.length, drawn=S.room.status==="drawn";
  let h=`<div class="card"><div class="lbl">Código de sala</div><div class="big">${esc(S.code)}</div>
  <div class="row"><button class="tq" data-a="cc">Copiar código</button><button class="tq" data-a="cl">Copiar enlace</button></div></div>`;
  if(drawn&&S.pair){
    const none=S.pair.none;
    h+=`<div class="card res"><div class="lbl">${none?"Esta ronda":"Tu pareja secreta es"}</div>
    <div class="n ${none?"none":S.show?"":"hid"}">${none?(S.show?"😅 No tienes pareja asignada en esta ronda":"••••••"):S.show?esc(S.pair.p):"••••••"}</div>
    <button class="rd" data-a="tog">${S.show?"🙈 Ocultar":"👀 Mostrar"}</button></div>`;
  }else if(drawn){h+=`<div class="card res"><div class="lbl">Sorteo hecho</div><p>Tú no estabas en la sala cuando se sorteó.</p></div>`}
  if(host){
    h+=`<div class="card">${n<MIN?`<p class="min">Se requieren mínimo ${MIN} jugadores (hay ${n}).</p>`:""}
    <button class="rd" data-a="draw" ${n<MIN?"disabled":""}>${drawn?"🎲 Sortear de nuevo":"🎲 Sortear"}</button></div>`;
  }else if(!drawn){h+=`<p class="sub" style="text-align:center">Esperando a que el anfitrión haga el sorteo…</p>`}
  h+=`<div class="card"><div class="lbl" style="margin-bottom:6px">Jugadores (${n})</div><ul>${order.map(id=>
    `<li><span>${esc(out[id])}</span><span>${id===S.room.host?'<span class="tag h">Anfitrión</span> ':""}${id===S.id?'<span class="tag">Tú</span>':""}</span></li>`).join("")}</ul></div>
  <button class="gh" data-a="leave">Salir</button>`;
  app.innerHTML=h;
}

app.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.a;
  try{
    if(a==="create"||a==="join"){
      const name=document.getElementById("name").value.trim();
      const code=document.getElementById("code").value.trim().toUpperCase();
      S.prefill={name,code};
      if(!name)throw new Error("Escribe tu nombre.");
      b.disabled=true;
      if(a==="create")await create(name);
      else{if(code.length!==5)throw new Error("El código tiene 5 caracteres.");await join(code,name)}
    }
    else if(a==="draw"){b.disabled=true;await draw()}
    else if(a==="tog"){S.show=!S.show;render()}
    else if(a==="cc")copy(S.code,b);
    else if(a==="cl")copy(link(S.code),b);
    else if(a==="leave"&&confirm("¿Salir de la sala?")){
      if(S.room&&S.room.status==="lobby"&&S.room.host!==S.id)await remove(ref(db,`rooms/${S.code}/players/${S.id}`));
      leave();
    }
  }catch(err){S.err=err.message||"Error de conexión";render()}
});

/* Arranque: enlace ?sala=CODE o sesión guardada */
(async()=>{
  const q=new URLSearchParams(location.search).get("sala");
  if(q)S.prefill.code=q.toUpperCase().slice(0,5);
  if(configured){
    try{
      const s=JSON.parse(localStorage.getItem("pololos")||"null");
      if(s&&!q){
        const ok=(await get(ref(db,`rooms/${s.code}/players/${s.id}`))).exists();
        if(ok){S.prefill.name=s.name;return start(s.code,s.id,s.name)}
        localStorage.removeItem("pololos");
      }else if(s)S.prefill.name=s.name;
    }catch{}
  }
  render();
})();
</script>
</body>
</html>
